<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Appeal Engine · demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23162E25'/%3E%3Cpath d='M8 24L16 8l8 16M11.5 18.5h9' stroke='%23F7F4ED' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #EFEAE0; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; }
  #shell-bar { display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 46px; background: #162E25; color: #F7F4ED; font-size: 13px; position: sticky; top: 0; z-index: 600; }
  #shell-bar .brand { font-weight: 600; letter-spacing: 0.01em; white-space: nowrap; }
  #shell-bar .fict { font-size: 11px; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #shell-bar button { height: 30px; border-radius: 6px; border: 1px solid rgba(247,244,237,0.3); background: transparent; color: #F7F4ED; font: inherit; font-size: 12px; padding: 0 10px; cursor: pointer; white-space: nowrap; }
  #shell-bar button:hover { background: rgba(247,244,237,0.12); }
  #shell-bar .sp { flex: 1; min-width: 0; }
  #menu-btn { display: none; width: 34px; padding: 0; font-size: 16px; line-height: 1; flex: none; }
  #screen-root { width: 100%; }
  #shell-toast { display: none; position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #1C1C1A; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 999; max-width: 90vw; }
  .nav, .navsub { cursor: pointer; }

  /* ---- responsive: below 1024 the app stacks and the sidebar becomes a drawer ---- */
  @media (max-width: 1023px) {
    #menu-btn { display: inline-flex; align-items: center; justify-content: center; }
    #shell-bar .fict { display: none; }
    .ae-root > .sidebar { display: none !important; }
    body.nav-open .ae-root > .sidebar {
      display: flex !important; position: fixed; left: 0; top: 46px; bottom: 0; width: 268px;
      height: auto !important; z-index: 550; box-shadow: 12px 0 40px rgba(28,28,26,0.25); overflow-y: auto;
    }
    body.nav-open::after { content: ''; position: fixed; inset: 46px 0 0 0; background: rgba(28,28,26,0.35); z-index: 540; }
    .ae-stack { flex-direction: column !important; height: auto !important; overflow: visible !important; }
    .ae-stack > * { max-width: 100% !important; }
    .panel { overflow-x: auto; }
    table.tbl { min-width: 560px; table-layout: auto; }
    .topbar { height: auto !important; min-height: 48px; flex-wrap: wrap; padding: 8px 14px !important; row-gap: 8px; }
    .actions, .doctools, .sec-h { flex-wrap: wrap; height: auto !important; }
  }
  @media (max-width: 620px) {
    #reset-all { font-size: 11px; padding: 0 8px; }
  }
</style>
<style id="screen-style"></style>
</head>
<body>
<div id="shell-bar">
  <button id="menu-btn" aria-label="Menu" title="Menu">☰</button>
  <span class="brand">Appeal Engine</span>
  <span class="fict">product demo · fictional data · nothing is sent anywhere</span>
  <span class="sp"></span>
  <button id="reset-all" title="Clear all saved demo state">Reset demo</button>
</div>
<div id="screen-root"></div>
<div id="shell-toast"></div>
<script src="screens.js"></script>
<script src="runtime.js"></script>
</body>
</html>
