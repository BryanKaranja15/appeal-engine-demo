<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Appeal Engine · demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23162E25'/%3E%3Cpath d='M8 24L16 8l8 16M11.5 18.5h9' stroke='%23F7F4ED' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #EFEAE0; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; }
  #shell-bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #162E25; color: #F7F4ED; font-size: 13px; flex-wrap: wrap; }
  #shell-bar .brand { font-weight: 600; letter-spacing: 0.01em; }
  #shell-bar .fict { font-size: 11px; opacity: 0.75; }
  #shell-bar select { height: 28px; border-radius: 6px; border: 0; padding: 0 8px; font: inherit; font-size: 13px; background: #F7F4ED; color: #1C1C1A; max-width: 42vw; }
  #shell-bar button { height: 28px; border-radius: 6px; border: 1px solid rgba(247,244,237,0.35); background: transparent; color: #F7F4ED; font: inherit; font-size: 12px; padding: 0 10px; cursor: pointer; }
  #shell-bar button:hover { background: rgba(247,244,237,0.12); }
  #shell-bar .sp { flex: 1; }
  #stage { display: flex; justify-content: center; padding: 12px 12px 24px; overflow-x: hidden; }
  #screen-scale { transform-origin: top center; width: 1440px; flex: none; }
  #screen-root > div:first-child { box-shadow: 0 10px 40px rgba(28,28,26,0.14); border-radius: 6px; }
  #shell-toast { display: none; position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #1C1C1A; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 999; max-width: 90vw; }
  .nav, .navsub { cursor: pointer; }
</style>
<style id="screen-style"></style>
</head>
<body>
<div id="shell-bar">
  <span class="brand">Appeal Engine</span>
  <span class="fict">product demo · fictional data · nothing is sent anywhere</span>
  <span class="sp"></span>
  <label>Screen&nbsp;<select id="screen-sel"></select></label>
  <label>Step&nbsp;<select id="state-sel"></select></label>
  <button id="reset-one">Reset screen</button>
  <button id="reset-all">Reset demo</button>
</div>
<div id="stage"><div id="screen-scale"><div id="screen-root"></div></div></div>
<div id="shell-toast"></div>
<script src="screens.js"></script>
<script src="runtime.js"></script>
</body>
</html>
